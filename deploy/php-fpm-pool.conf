; /etc/php/8.5/fpm/pool.d/coffeeproject.conf
; A dedicated pool that runs as the coffeeproject user, so the web app, queue
; worker, scheduler and deploys all share one owner (no permission issues).

[coffeeproject]
user = coffeeproject
group = coffeeproject

listen = /run/php/coffeeproject.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
