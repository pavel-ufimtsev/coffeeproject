; /etc/php/8.5/fpm/conf.d/99-coffeeproject.ini  (and /etc/php/8.5/cli/conf.d/99-coffeeproject.ini)
; Production counterpart of docker/php/php.ini and docker/php/opcache.ini.

display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 25M
max_execution_time = 60
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Never re-check files; deploy.sh reloads PHP-FPM after each release.
opcache.validate_timestamps = 0
opcache.save_comments = 1
