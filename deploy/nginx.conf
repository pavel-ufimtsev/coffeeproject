# /etc/nginx/sites-available/coffeeproject
# Point DNS for coffeeproject.ru and www at the server, then run certbot:
#   sudo certbot --nginx -d coffeeproject.ru -d www.coffeeproject.ru
# certbot adds the HTTPS server block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name coffeeproject.ru www.coffeeproject.ru;

    root /var/www/coffeeproject/src/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Hashed Vite assets never change, so cache them for a long time.
    location /build/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/coffeeproject.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
