; /etc/supervisor/conf.d/coffeeproject.conf
; Keeps the queue worker running (order emails and other queued jobs). deploy.sh runs
; `php artisan queue:restart`; the worker exits and Supervisor starts it again
; with the new code.

[program:coffeeproject-queue]
command=/usr/bin/php /var/www/coffeeproject/src/artisan queue:work --tries=3 --timeout=90 --max-time=3600
directory=/var/www/coffeeproject/src
user=coffeeproject
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=100
redirect_stderr=true
stdout_logfile=/var/www/coffeeproject/src/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
